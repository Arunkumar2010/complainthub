<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- background circle -->
  <circle cx="50" cy="50" r="50" fill="#2563eb"/>
  <!-- antenna -->
  <line x1="50" y1="16" x2="50" y2="8" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="6" r="3.5" fill="#93c5fd"/>
  <!-- head -->
  <rect x="26" y="18" width="48" height="38" rx="10" fill="white"/>
  <!-- eyes -->
  <rect x="32" y="27" width="14" height="14" rx="4" fill="#2563eb"/>
  <rect x="54" y="27" width="14" height="14" rx="4" fill="#2563eb"/>
  <!-- eye shine -->
  <circle cx="37" cy="31" r="3" fill="white"/>
  <circle cx="59" cy="31" r="3" fill="white"/>
  <circle cx="39" cy="33" r="1.5" fill="white"/>
  <circle cx="61" cy="33" r="1.5" fill="white"/>
  <!-- smile -->
  <path d="M36 46 Q50 56 64 46" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="30" cy="47" rx="5" ry="3" fill="#93c5fd" opacity="0.5"/>
  <ellipse cx="70" cy="47" rx="5" ry="3" fill="#93c5fd" opacity="0.5"/>
  <!-- body -->
  <rect x="30" y="60" width="40" height="26" rx="8" fill="white"/>
  <!-- chest lights -->
  <circle cx="41" cy="70" r="3.5" fill="#34d399"/>
  <circle cx="50" cy="70" r="3.5" fill="#fbbf24"/>
  <circle cx="59" cy="70" r="3.5" fill="#f87171"/>
  <!-- chest bar -->
  <rect x="36" y="78" width="28" height="3" rx="1.5" fill="#bfdbfe"/>
</svg>
